<div
  [ngClass]="{
    'p-2 custom-border': chips.length > 0,
    'custom-border-error': error,
  }"
>
  <p-floatlabel
    variant="on"
    class="custom-floatlabel"
    [class.invalid-floatlabel]="error"
  >
    <p-multiselect
      #pmulti
      class="w-full custom-multiselect"
      optionValue="value"
      optionLabel="label"
      appendTo="body"
      panelStyleClass="custom-multiselect"
      [showToggleAll]="false"
      [options]="multiselectOptions"
      [ngModel]="chips"
      [inputId]="fieldName"
      [maxSelectedLabels]="0"
      [class.invalid-multiselect]="error"
      [resetFilterOnHide]="true"
      [filterPlaceHolder]="filterPlaceholder"
      [showClear]="true"
      [virtualScroll]="isFieldsSource"
      [virtualScrollItemSize]="isFieldsSource ? 34 : null"
      [group]="isFieldsSource"
      [optionGroupLabel]="isFieldsSource ? 'label' : undefined"
      [optionGroupChildren]="isFieldsSource ? 'items' : ''"
      (ngModelChange)="multiselectChange($event)"
      (onPanelShow)="onDropdownOpen()"
      (onFilter)="currentText = pmulti.filterValue || ''"
      (onClear)="clear()"
    >
      <ng-template #footer>
        @if (showCustomButton && !pmulti.isEmpty()) {
          <div class="flex p-3">
            <p-button
              class="custom-button"
              icon="pi pi-plus"
              size="small"
              [label]="`Add custom ${fieldNameSingular}`"
              (onClick)="clickButton()"
            ></p-button>
          </div>
        }
      </ng-template>

      <ng-template #emptyfilter>
        @if (showCustomButton) {
          <p-button
            class="custom-button"
            icon="pi pi-plus"
            size="small"
            [label]="`Add custom ${fieldNameSingular}`"
            (onClick)="clickButton()"
          ></p-button>
        }
      </ng-template>

      <ng-template #filtericon>
        <i class="pi pi-bookmark"></i>
      </ng-template>

      <ng-template #selecteditems>
        {{ chips.length }}
        {{ chips.length === 1 ? "item selected" : "items selected" }}
      </ng-template>
    </p-multiselect>

    <label [for]="fieldName">{{ fieldName }}</label>
  </p-floatlabel>

  @if (chips.length !== 0) {
    <div class="flex flex-wrap gap-2 mt-3">
      @for (chip of chips; track chip) {
        <p-chip
          class="custom-chip"
          [class.chip-animation]="chipAnimations[chip]"
          [label]="chip"
          [removable]="true"
          (onRemove)="deleteChip(chip)"
        />
      }
    </div>
  }
</div>
